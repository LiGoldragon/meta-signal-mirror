[package]
name = "meta-signal-mirror"
version = "4.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/meta-signal-mirror"
description = "Current owner Signal contract for mirror configuration and store policy."
publish = false
links = "meta-signal-mirror"
build = "build.rs"

[lib]
name = "meta_signal_mirror"
path = "src/lib.rs"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "signal-mirror/datom", "signal/datom"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "eabead4", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "3c7ade3", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-mirror = { git = "https://github.com/LiGoldragon/signal-mirror", rev = "d0c5d1b", default-features = false }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "7afb68b", default-features = false }

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "5a5daca" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
