[package]
name = "meta-signal-mirror"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/meta-signal-mirror"
description = "Current owner Signal contract for mirror configuration and store policy."
publish = false
links = "meta-signal-mirror"
build = "build.rs"

[lib]
name = "meta_signal_mirror"
path = "src/lib.rs"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "signal-mirror/datom", "signal-standard/datom"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "f2cc06858d38a4028c928d33323a6d682e7c222f", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "b543678cfc8609529cea7174eb4af8a64daa54ad", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-mirror = { git = "https://github.com/LiGoldragon/signal-mirror.git", rev = "2198d0b5c142dd37e68ab3fe7335a2cb28da1a6b", default-features = false }
signal-standard = { git = "https://github.com/LiGoldragon/signal-standard.git", rev = "2c90fc9976b3af33f49cdf83bb33f7f246ae2b60", default-features = false }

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "4695ee0c1f5d00dcf5cceba08f5fa00412b92184" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
